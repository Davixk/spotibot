# Runs the published Spotibot image from GHCR. This is the default deploy file.
#   1. cp .env.example .env   (set DASHBOARD_PASSWORD, SESSION_SECRET, TOKEN_ENCRYPTION_KEY)
#   2. docker compose up -d
# Pin a version with SPOTIBOT_TAG (e.g. SPOTIBOT_TAG=sha-abc1234) in .env.
# To build from source instead, use: docker compose -f docker-compose.local.yml up --build
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: spotibot
      POSTGRES_PASSWORD: spotibot
      POSTGRES_DB: spotibot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spotibot']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/davixk/spotibot:${SPOTIBOT_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
      DATABASE_URL: postgres://spotibot:spotibot@postgres:5432/spotibot
    ports:
      - '8080:8080'
    restart: unless-stopped

volumes:
  pgdata:
